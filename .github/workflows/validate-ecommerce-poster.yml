name: Validate ecommerce poster skill

on:
  push:
    paths:
      - "skills/ecommerce-poster-design-3.1.0/**"
      - "tests/ecommerce-poster-design-3.1.0/**"
      - "scripts/validate_release_lock.py"
      - "RELEASE_LOCK.json"
      - "RELEASE_MANIFEST.json"
      - "PROJECT_STATUS.md"
      - "README.md"
      - "INSTALL.md"
      - "CHANGELOG.md"
      - "VERSIONS.md"
      - "RELEASE_NOTES_3.1.0-rc.4.md"
      - ".github/workflows/validate-ecommerce-poster.yml"
  pull_request:
    paths:
      - "skills/ecommerce-poster-design-3.1.0/**"
      - "tests/ecommerce-poster-design-3.1.0/**"
      - "scripts/validate_release_lock.py"
      - "RELEASE_LOCK.json"
      - "RELEASE_MANIFEST.json"
      - "PROJECT_STATUS.md"
      - "README.md"
      - "INSTALL.md"
      - "CHANGELOG.md"
      - "VERSIONS.md"
      - "RELEASE_NOTES_3.1.0-rc.4.md"
      - ".github/workflows/validate-ecommerce-poster.yml"

jobs:
  validate_rc_4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release lock and integrations
        run: |
          python scripts/validate_release_lock.py .
          python skills/ecommerce-poster-design-3.1.0/scripts/validate_classification.py skills/ecommerce-poster-design-3.1.0/assets/classification
          python skills/ecommerce-poster-design-3.1.0/scripts/validate_consumer_integration.py skills/ecommerce-poster-design-3.1.0
          python skills/ecommerce-poster-design-3.1.0/scripts/validate_aesthetic_integration.py skills/ecommerce-poster-design-3.1.0
          python skills/ecommerce-poster-design-3.1.0/scripts/validate_final_quality_integration.py skills/ecommerce-poster-design-3.1.0
          python skills/ecommerce-poster-design-3.1.0/scripts/validate_logo_pipeline.py skills/ecommerce-poster-design-3.1.0
          python skills/ecommerce-poster-design-3.1.0/scripts/validate_canvas_normalization.py skills/ecommerce-poster-design-3.1.0
      - name: Run deterministic tests
        working-directory: skills/ecommerce-poster-design-3.1.0
        run: |
          python scripts/test_canvas_normalization.py
          python scripts/test_consumer_routing.py
          python scripts/test_aesthetic_integration.py
          python scripts/test_final_quality_routing.py
          python modules/consumer-agent/scripts/run_evals.py
          python -m unittest modules/aesthetic-agent/tests/test_score_evaluation.py
      - name: Enforce ImageGen ownership boundary
        shell: python
        run: |
          from pathlib import Path
          root = Path("skills/ecommerce-poster-design-3.1.0")
          runtime_roots = [
              root / "modules" / "consumer-agent",
              root / "modules" / "aesthetic-agent" / "scripts",
              root / "modules" / "aesthetic-agent" / "agents",
          ]
          hits = []
          for runtime_root in runtime_roots:
              for path in runtime_root.rglob("*"):
                  if path.is_file():
                      text = path.read_text(encoding="utf-8", errors="ignore").lower()
                      if "imagegen" in text or "image_gen" in text:
                          hits.append(str(path))
          assert not hits, "Agents must not call ImageGen directly: " + ", ".join(hits)
          skill_text = (root / "SKILL.md").read_text(encoding="utf-8").lower()
          assert "imagegen" in skill_text and "image_gen" in skill_text
