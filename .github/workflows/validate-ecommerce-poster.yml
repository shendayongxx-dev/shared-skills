name: Validate ecommerce poster skill

on:
  push:
    paths:
      - "skills/ecommerce-poster-design/**"
      - "tests/ecommerce-poster-design/**"
      - "PROJECT_STATUS.md"
      - "RELEASE_MANIFEST.json"
      - "README.md"
      - "INSTALL.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/validate-ecommerce-poster.yml"
  pull_request:
    paths:
      - "skills/ecommerce-poster-design/**"
      - "tests/ecommerce-poster-design/**"
      - "PROJECT_STATUS.md"
      - "RELEASE_MANIFEST.json"
      - "README.md"
      - "INSTALL.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/validate-ecommerce-poster.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate classification assets
        run: >-
          python skills/ecommerce-poster-design/scripts/validate_classification.py
          skills/ecommerce-poster-design/assets/classification

      - name: Exercise deterministic rule selection
        run: >-
          python skills/ecommerce-poster-design/scripts/select_style.py
          skills/ecommerce-poster-design/assets/classification
          P02 M03 S03 --request-id CI-SMOKE

      - name: Verify connected C library and six seed scenarios
        shell: python
        run: |
          import json
          import subprocess
          import sys

          validator = "skills/ecommerce-poster-design/scripts/validate_classification.py"
          selector = "skills/ecommerce-poster-design/scripts/select_style.py"
          assets = "skills/ecommerce-poster-design/assets/classification"

          validation = json.loads(subprocess.check_output([sys.executable, validator, assets]))
          assert validation["valid"] is True
          assert validation["production_ready"] is True
          assert validation["counts"]["eligible_seed_cases"] == 6
          assert validation["counts"]["eligible_seed_scenarios"] == 6

          exact = json.loads(subprocess.check_output([
              sys.executable, selector, assets, "P02", "M03", "S03",
              "--request-id", "CI-FORMAL-EXACT",
          ]))
          assert exact["source_rule_ids"] == ["R-001"]
          assert exact["source_case_ids"] == ["C-030"]
          assert exact["source_case_references"][0]["checksum_sha256"]

      - name: Validate Consumer Agent integration
        run: >-
          python skills/ecommerce-poster-design/scripts/validate_consumer_integration.py
          skills/ecommerce-poster-design

      - name: Exercise Consumer Agent routing
        run: python skills/ecommerce-poster-design/scripts/test_consumer_routing.py

      - name: Validate stable release and C-library state
        shell: python
        run: |
          import json
          from pathlib import Path

          version = json.loads(
              Path("skills/ecommerce-poster-design/assets/config/version.json")
              .read_text(encoding="utf-8")
          )
          manifest = json.loads(
              Path("RELEASE_MANIFEST.json").read_text(encoding="utf-8")
          )

          assert version["skill_version"] == manifest["version"]
          assert version["skill_version"] == "2.0.1"
          assert version["release_channel"] == "local-integrated"
          assert version["final_1_0"] is False
          assert version["production_ready"] is True
          assert version["feature_flags"] == {
              "consumer_agent": True,
              "aesthetic_agent": False,
          }
          assert version["consumer_agent_module"]["version"] == "1.5.3"
          assert version["consumer_agent_module"]["interface_version"] == "A-D-2.0"
          assert version["c_library"]["status"] == "connected"
          assert version["c_library"]["asset_mode"] == "production_internal_reference"
          assert version["c_library"]["eligible_seed_cases"] == 6
          assert manifest["release_channel"] == "stable"
          assert manifest["production_ready"] is True
          assert manifest["consumer_agent"]["version"] == "1.5.3"
          assert manifest["consumer_agent"]["interface_version"] == "A-D-2.0"
          assert manifest["release_tag"] == "ecommerce-poster-design-v2.0.1"

      - name: Reject private and third-party raster assets
        shell: python
        run: |
          from pathlib import Path

          forbidden = {".png", ".jpg", ".jpeg", ".webp"}
          roots = [
              Path("tests/ecommerce-poster-design"),
              Path("skills/ecommerce-poster-design/assets/classification"),
          ]
          found = []
          for root in roots:
              found.extend(
                  str(path)
                  for path in root.rglob("*")
                  if path.is_file() and path.suffix.lower() in forbidden
              )
          assert not found, "Do not commit user or third-party raster images: " + ", ".join(found)
