name: Validate ecommerce poster skill

on:
  push:
    paths:
      - "skills/ecommerce-poster-design-3.0.0/**"
      - "skills/ecommerce-poster-design-1.0.0-aesthetic-first-ablation.1/**"
      - "tests/ecommerce-poster-design-3.0.0/**"
      - "PROJECT_STATUS.md"
      - "RELEASE_MANIFEST.json"
      - "README.md"
      - "INSTALL.md"
      - "CHANGELOG.md"
      - "VERSIONS.md"
      - ".github/workflows/validate-ecommerce-poster.yml"
  pull_request:
    paths:
      - "skills/ecommerce-poster-design-3.0.0/**"
      - "skills/ecommerce-poster-design-1.0.0-aesthetic-first-ablation.1/**"
      - "tests/ecommerce-poster-design-3.0.0/**"
      - "PROJECT_STATUS.md"
      - "RELEASE_MANIFEST.json"
      - "README.md"
      - "INSTALL.md"
      - "CHANGELOG.md"
      - "VERSIONS.md"
      - ".github/workflows/validate-ecommerce-poster.yml"

jobs:
  validate_aesthetic_first_ablation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ablation integration and classification
        run: |
          python skills/ecommerce-poster-design-1.0.0-aesthetic-first-ablation.1/scripts/validate_ablation_integration.py skills/ecommerce-poster-design-1.0.0-aesthetic-first-ablation.1
          python skills/ecommerce-poster-design-1.0.0-aesthetic-first-ablation.1/scripts/validate_classification.py skills/ecommerce-poster-design-1.0.0-aesthetic-first-ablation.1/assets/classification
      - name: Test ablation routing and agent modules
        run: |
          python skills/ecommerce-poster-design-1.0.0-aesthetic-first-ablation.1/scripts/test_ablation_routing.py
          python skills/ecommerce-poster-design-1.0.0-aesthetic-first-ablation.1/modules/consumer-agent/scripts/run_evals.py
          cd skills/ecommerce-poster-design-1.0.0-aesthetic-first-ablation.1
          node --test modules/aesthetic-agent/tests/evaluate.test.mjs modules/aesthetic-agent/tests/references.test.mjs modules/aesthetic-agent/tests/quality.test.mjs

  validate_v3_0_0:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate integrations and classification
        run: |
          python skills/ecommerce-poster-design-3.0.0/scripts/validate_consumer_integration.py skills/ecommerce-poster-design-3.0.0
          python skills/ecommerce-poster-design-3.0.0/scripts/validate_aesthetic_integration.py skills/ecommerce-poster-design-3.0.0
          python skills/ecommerce-poster-design-3.0.0/scripts/validate_classification.py skills/ecommerce-poster-design-3.0.0/assets/classification
      - name: Test host routing and agent modules
        run: |
          python skills/ecommerce-poster-design-3.0.0/scripts/test_consumer_routing.py
          python skills/ecommerce-poster-design-3.0.0/scripts/test_aesthetic_integration.py
          python skills/ecommerce-poster-design-3.0.0/modules/consumer-agent/scripts/run_evals.py
          cd skills/ecommerce-poster-design-3.0.0
          node --test modules/aesthetic-agent/tests/evaluate.test.mjs modules/aesthetic-agent/tests/references.test.mjs modules/aesthetic-agent/tests/quality.test.mjs
      - name: Enforce ImageGen ownership boundary
        shell: python
        run: |
          from pathlib import Path
          root = Path("skills/ecommerce-poster-design-3.0.0")
          runtime_roots = [
              root / "modules" / "consumer-agent",
              root / "modules" / "aesthetic-agent" / "scripts",
              root / "modules" / "aesthetic-agent" / "agents",
          ]
          hits = []
          for runtime_root in runtime_roots:
              for path in runtime_root.rglob("*"):
                  if path.is_file():
                      text = path.read_text(encoding="utf-8", errors="ignore").lower()
                      if "imagegen" in text or "image_gen" in text:
                          hits.append(str(path))
          assert not hits, "Agents must not call ImageGen directly: " + ", ".join(hits)
          skill_text = (root / "SKILL.md").read_text(encoding="utf-8").lower()
          assert "imagegen" in skill_text and "image_gen" in skill_text
